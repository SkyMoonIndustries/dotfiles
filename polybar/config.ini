[colors]
# Mat siyah, soluk gri ve T480 kırmızısı
background = #111111
foreground = #888888
alert = #CC0000

[bar/brutalist]
width = 100%
height = 24
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

# Üstüne 1 piksellik ince bir çerçeve
border-top-size = 1
border-top-color = #333333

# Sistem fontu olarak en düz, monospaced terminal fontunu kullanıyoruz
font-0 = monospace:size=10;2

# Sol, orta ve sağda duracak modüller
modules-left = i3
modules-center = date
modules-right = mcu pulseaudio backlight temperature cpu memory totalbattery systray

[module/i3]
type = internal/i3
format = <label-state> <label-mode>

# Seçili ekran kırmızılı ve beyaz yazılı
label-focused = %index%
label-focused-foreground = #FFFFFF
label-focused-background = ${colors.alert}
label-focused-padding = 2

# Diğer ekranlar mat gri
label-unfocused = %index%
label-unfocused-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%
format-padding = 2

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%
format-padding = 2

[module/date]
type = internal/date
interval = 5
date = "%Y-%m-%d"
time = "%H:%M"
label = %date% %time%

[module/totalbattery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 10
format-padding = 2

[module/mcu]
type = custom/script
# Sisteme bağlı USB/ACM seri port var mı diye bakar. Varsa kırmızı "COM: UP" yazar.
exec = if ls /dev/ttyUSB* /dev/ttyACM* 1> /dev/null 2>&1; then echo "COM: UP"; else echo ""; fi
interval = 2
format-foreground = ${colors.alert}
format-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume = VOL <label-volume>
label-volume = %percentage%%
label-muted = VOL MUTE
label-muted-foreground = #555555
format-volume-padding = 2
format-muted-padding = 2

[module/backlight]
type = internal/backlight
# T480'in dahili Intel ekran kartı için ışık kontrolcüsü
card = intel_backlight
format = BRT <label>
label = %percentage%%
format-padding = 2

[module/temperature]
type = internal/temperature
# Genel işlemci sıcaklık sensörünü okur
thermal-zone = 0
warn-temperature = 80
format = TEMP <label>
label = %temperature-c%
format-padding = 2

[module/systray]
type = internal/tray
tray-spacing = 4px
format-padding = 2
